name: CI

on:
    pull_request:
        branches:
            - develop
            - main

permissions:
    contents: read

jobs:
    quality-gates:
        name: ci
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: tankit
                    POSTGRES_PASSWORD: tankit_dev
                    POSTGRES_DB: tankit
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U tankit -d tankit"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            HUSKY: 0
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn
                  cache-dependency-path: |
                      yarn.lock
                      frontend/game/yarn.lock
                      frontend/app/yarn.lock

            - name: Enable Yarn Classic
              run: |
                  corepack enable
                  corepack prepare yarn@1.22.22 --activate

            - name: Install shared tooling
              run: yarn install --frozen-lockfile

            - name: Install game dependencies
              working-directory: frontend/game
              run: yarn install --frozen-lockfile

            - name: Install app dependencies
              working-directory: frontend/app
              run: yarn install --frozen-lockfile

            - name: Install Playwright browser
              working-directory: frontend/app
              run: yarn playwright install --with-deps chromium

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.113

            - name: Run frontend gates
              run: make lint-frontend typecheck-frontend build test-frontend

            - name: Run backend gates
              run: make lint-backend typecheck-backend test-backend
