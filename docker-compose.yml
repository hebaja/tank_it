name: tankit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tankit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tankit_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tankit}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tankit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/src/TankIt.Api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-tankit};
        Username=${POSTGRES_USER:-tankit};Password=${POSTGRES_PASSWORD:-tankit_dev}
      FrontendOrigin: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend/game
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend/game
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend/game/src:/app/src
      - ./frontend/game/index.html:/app/index.html
      - ./frontend/game/public:/app/public
      - ./frontend/game/vite:/app/vite
      - ./frontend/game/tsconfig.json:/app/tsconfig.json
      - ./frontend/game/log.js:/app/log.js
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend

  # frontend:
  #   Uncomment once frontend/app/ has a chosen framework + Dockerfile
  #   (see frontend/app/README.md — this is still an open decision).
  #   build:
  #     context: ./frontend/app
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   environment:
  #     VITE_API_URL: http://localhost:${BACKEND_PORT:-8080}
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:5173"

volumes:
  db_data:
